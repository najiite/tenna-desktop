appId: com.najiite.tenna.desktop
productName: Tenna IPTV Player
directories:
  output: release
  buildResources: build
files:
  - main.js
  - preload.js
  - package.json
  - app/**
  - build/icon.png
afterPack: build/after-pack.js
# Installers go to a GitHub release; the app reads latest.yml / latest-mac.yml from it to find updates (see checkForUpdates in main.js)
publish:
  provider: github
  owner: najiite
  repo: tenna-desktop
win:
  extraResources:
    - from: build/ffmpeg/win32-x64
      to: ffmpeg
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # The icon and version are stamped into the .exe by build/after-pack.js (rcedit would need Wine on a Mac)
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  # Named for the chip: mac-arm64 is for Apple Silicon (M1 and later), mac-x64 for Intel Macs
  artifactName: Tenna-IPTV-Player-${version}-mac-${arch}.${ext}
  extraResources:
    - from: build/ffmpeg/darwin-${arch}
      to: ffmpeg
  category: public.app-category.entertainment
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    # electron-updater reads the Mac update from a .zip; the .dmg is what people download
    - target: zip
      arch: [arm64, x64]
  # Unsigned for now: signing and notarizing needs an Apple Developer ID (see README)
  identity: null
dmg:
  title: Tenna IPTV Player
