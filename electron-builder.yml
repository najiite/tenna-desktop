appId: com.najiite.tenna.desktop
productName: Tenna IPTV Player
directories:
  output: release
  buildResources: build
files:
  - main.js
  - package.json
  - app/**
  - build/icon.png
afterPack: build/after-pack.js
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # The icon and version are stamped into the .exe by build/after-pack.js (rcedit would need Wine on a Mac)
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  category: public.app-category.entertainment
  icon: build/icon.png
